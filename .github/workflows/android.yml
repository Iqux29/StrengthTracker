name: Build Android APK
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Attach APK to V1.0 release'
        required: false
        default: 'true'
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo prebuild --platform android --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x android/gradlew
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m" >> ~/.gradle/gradle.properties
      - name: Build standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Steelwork-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Steelwork-v1.0-APK
          path: Steelwork-v1.0.apk
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.attach_to_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Steelwork-v1.0.apk
          tag_name: V1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
